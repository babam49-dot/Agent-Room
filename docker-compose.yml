version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentroom
      POSTGRES_PASSWORD: agentroom
      POSTGRES_DB: agentroom
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentroom -d agentroom']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentroom-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
